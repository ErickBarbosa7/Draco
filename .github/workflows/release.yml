name: 'Release Tauri App'

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Rust (Stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontend/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ./frontend
          tagName: ${{ github.ref_name }}
          releaseName: 'Draco ${{ github.ref_name }}'
          releaseBody: 'Nueva versión de Draco.'
          releaseDraft: false
          prerelease: false

      - name: Verify updater manifest was generated
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
            });
            const names = release.data.assets.map((a) => a.name);

            // El updater de la app depende de estos artefactos. Sin ellos el
            // actualizador no funciona y el release es inútil para las apps
            // instaladas, por eso el workflow debe fallar.
            const hasSigBundle = names.some((n) => n.endsWith('.tar.gz') && names.includes(n + '.sig'));
            if (!names.includes('latest.json') || !hasSigBundle) {
              const problemas = [];
              if (!names.includes('latest.json')) problemas.push('falta latest.json');
              if (!hasSigBundle) problemas.push('no se generaron los .tar.gz/.sig firmados');
              throw new Error(
                `Release roto para el updater (${problemas.join(', ')}). ` +
                'Confirma que los secrets TAURI_PRIVATE_KEY y TAURI_PRIVATE_KEY_PASSWORD ' +
                'estén configurados y sean un par válido en Settings → Secrets → Actions.',
              );
            }
            console.log(`Release ${tag} OK: latest.json + bundles firmados presentes (${names.length} assets).`);
